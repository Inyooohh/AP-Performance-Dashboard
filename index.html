        tailwind.config = {

</head>
<body class="bg-[#0b1210] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ path, size = 18, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const UsersIcon = (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
        const ClockIcon = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></>} />;
        const TrendingUpIcon = (props) => <Icon {...props} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />;
        const RefreshCwIcon = (props) => <Icon {...props} path={<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />;
        const FilterIcon = (props) => <Icon {...props} path={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>} />;
        const ZapIcon = (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />;
        const CalendarIcon = (props) => <Icon {...props} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;
        const AlertCircleIcon = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
        const TruckIcon = (props) => <Icon {...props} path={<><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>} />;

        // Fallback Initial Data
        const initialParkData = [
            { id: 'STAFF-01', name: 'Valen', date: '2026-10-16', parkedDocs: 142, avgMinutes: 12.5, slaDaysAvg: 0.8, complianceRate: '96.2%', 
              vendors: [
                { name: 'Great Giant Pineapple Co.', docCount: 45, avgMin: 14.2, slaDays: 0.7, isOverSla: false },
                { name: 'Lavilla Kreatif Perkasa', docCount: 38, avgMin: 11.5, slaDays: 0.5, isOverSla: false }
              ] 
            },
            { id: 'STAFF-02', name: 'Ino', date: '2026-10-16', parkedDocs: 58, avgMinutes: 18.2, slaDaysAvg: 1.2, complianceRate: '88.5%', 
              vendors: [
                { name: 'Nusantara Segar Abadi (Blitar)', docCount: 26, avgMin: 20.5, slaDays: 1.3, isOverSla: true },
                { name: 'Gelatik Supra', docCount: 20, avgMin: 16.0, slaDays: 0.9, isOverSla: false }
              ] 
            }
        ];

        const initialPostData = [
            { id: 'SPV-01', name: 'Dewi Lestari', date: '2026-10-16', postedDocs: 115, avgMinutes: 12.4, slaDaysAvg: 1.8, complianceRate: '98.5%', 
              vendors: [
                { name: 'Great Giant Pineapple Co.', docCount: 45, avgMin: 14.2, slaDays: 2.1, isOverSla: false },
                { name: 'Lavilla Kreatif Perkasa', docCount: 40, avgMin: 11.0, slaDays: 1.5, isOverSla: false }
              ] 
            },
            { id: 'SPV-02', name: 'Rian Pratama', date: '2026-10-16', postedDocs: 92, avgMinutes: 32.1, slaDaysAvg: 3.4, complianceRate: '82.0%', 
              vendors: [
                { name: 'Riyozha Telekomunikasi Indonesia', docCount: 42, avgMin: 36.5, slaDays: 3.8, isOverSla: true },
                { name: 'Marc Tri Manunggal', docCount: 30, avgMin: 28.0, slaDays: 3.1, isOverSla: true }
              ] 
            }
        ];

        const trendDatasets = {
            daily: [
                { period: '12 Oct', parkVol: 38, parkMin: 16.2, postVol: 110, postMin: 23.5 },
                { period: '13 Oct', parkVol: 45, parkMin: 15.8, postVol: 128, postMin: 22.1 },
                { period: '14 Oct', parkVol: 52, parkMin: 17.4, postVol: 142, postMin: 24.8 },
                { period: '15 Oct', parkVol: 41, parkMin: 14.9, postVol: 135, postMin: 21.2 },
                { period: '16 Oct', parkVol: 43, parkMin: 16.1, postVol: 143, postMin: 22.8 }
            ],
            weekly: [
                { period: 'W1 Sep', parkVol: 180, parkMin: 19.5, postVol: 540, postMin: 28.2 },
                { period: 'W2 Sep', parkVol: 210, parkMin: 18.2, postVol: 590, postMin: 26.4 },
                { period: 'W3 Sep', parkVol: 195, parkMin: 17.0, postVol: 620, postMin: 24.1 },
                { period: 'W4 Sep', parkVol: 225, parkMin: 16.3, postVol: 658, postMin: 23.2 },
                { period: 'W1 Oct', parkVol: 219, parkMin: 16.1, postVol: 658, postMin: 22.8 }
            ],
            monthly: [
                { period: 'Mei', parkVol: 780, parkMin: 22.4, postVol: 2350, postMin: 32.1 },
                { period: 'Jun', parkVol: 820, parkMin: 20.8, postVol: 2480, postMin: 29.5 },
                { period: 'Jul', parkVol: 890, parkMin: 19.1, postVol: 2610, postMin: 27.2 },
                { period: 'Agt', parkVol: 850, parkMin: 17.6, postVol: 2590, postMin: 25.0 },
                { period: 'Sep', parkVol: 910, parkMin: 16.5, postVol: 2750, postMin: 23.8 },
                { period: 'Okt', parkVol: 520, parkMin: 16.1, postVol: 1580, postMin: 22.8 }
            ],
            yearly: [
                { period: '2023', parkVol: 7400, parkMin: 28.5, postVol: 21200, postMin: 39.4 },
                { period: '2024', parkVol: 8800, parkMin: 24.1, postVol: 25400, postMin: 34.0 },
                { period: '2025', parkVol: 9900, parkMin: 19.8, postVol: 29100, postMin: 28.2 },
                { period: '2026', parkVol: 8200, parkMin: 17.2, postVol: 24900, postMin: 24.5 }
            ]
        };

        const CombinedTrendChart = ({ data, volKey, minKey, barColor, lineColor, barLabel, activeFilterName }) => {
            const maxVol = Math.max(...data.map(d => d[volKey]), 1);
            const maxMin = Math.max(...data.map(d => d[minKey]), 1);

            return (
                <div className="w-full h-full flex flex-col justify-between pt-6 pb-2 px-2 relative">
                    <div className="absolute inset-x-8 top-10 bottom-10 pointer-events-none z-10">
                        <svg className="w-full h-full overflow-visible">
                            <polyline
                                fill="none"
                                stroke={lineColor}
                                strokeWidth="3"
                                strokeDasharray="4 2"
                                points={data.map((item, idx) => {
                                    const x = (idx / (data.length - 1 || 1)) * 100;
                                    const y = 100 - ((item[minKey] / maxMin) * 80);
                                    return `${x}%,${y}%`;
                                }).join(' ')}
                            />
                            {data.map((item, idx) => {
                                const x = (idx / (data.length - 1 || 1)) * 100;
                                const y = 100 - ((item[minKey] / maxMin) * 80);
                                return (
                                    <g key={idx}>
                                        <circle cx={`${x}%`} cy={`${y}%`} r="4" fill="#0f172a" stroke={lineColor} strokeWidth="2.5" />
                                        <text x={`${x}%`} y={`calc(${y}% - 8px)`} fill="#f1f5f9" fontSize="9" fontWeight="bold" textAnchor="middle">
                                            {item[minKey]}m
                                        </text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>

                    <div className="w-full h-40 flex items-end justify-between gap-2 px-4">
                        {data.map((item, idx) => {
                            const heightPct = Math.round((item[volKey] / maxVol) * 80);
                            return (
                                <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative z-0">
                                    <div className="absolute -top-12 opacity-0 group-hover:opacity-100 bg-slate-800 text-slate-100 text-[10px] p-2 rounded shadow-xl border border-slate-700 z-20 whitespace-nowrap transition-all pointer-events-none">
                                        <p className="font-bold text-amber-400">{item.period}</p>
                                        <p>{barLabel}: <span className="font-semibold text-slate-200">{item[volKey]} doc</span></p>
                                        <p>Avg Time: <span className="font-semibold text-emerald-400">{item[minKey]} min/doc</span></p>
                                        {activeFilterName !== 'ALL' && <p className="text-[9px] text-slate-400 italic mt-0.5">*Filter active: {activeFilterName}</p>}
                                    </div>
                                    <div 
                                        className={`w-full max-w-[32px] ${barColor} rounded-t-md transition-all duration-300 group-hover:brightness-125 flex items-top justify-center pt-1`}
                                        style={{ height: `${Math.max(heightPct, 10)}%` }}
                                    >
                                        <span className="text-[8px] font-bold text-slate-950 truncate px-0.5">{item[volKey]}</span>
                                    </div>
                                    <span className="text-[9px] font-medium text-slate-400 mt-2 text-center truncate max-w-[60px]">{item.period}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        function App() {
            const [parkStartDate, setParkStartDate] = useState('2026-10-01');
            const [parkEndDate, setParkEndDate] = useState('2026-10-16');

            const [postStartDate, setPostStartDate] = useState('2026-10-01');
            const [postEndDate, setPostEndDate] = useState('2026-10-16');

            const [selectedParkPic, setSelectedParkPic] = useState('ALL');
            const [selectedPostSpv, setSelectedPostSpv] = useState('ALL');

            const [parkTimeFrame, setParkTimeFrame] = useState('daily');
            const [postTimeFrame, setPostTimeFrame] = useState('daily');

            const [lastUpdated, setLastUpdated] = useState('16 Okt 2026, 11:00 WIB');
            const [parkData, setParkData] = useState(initialParkData);
            const [postData, setPostData] = useState(initialPostData);

            // Robust Normalizer for Power Automate JSON (Cleans keys with newlines / spaces)
            const normalizePowerAutomateData = (json) => {
                const cleanObj = (obj) => {
                    if (!obj || typeof obj !== 'object') return {};
                    const cleaned = {};
                    Object.keys(obj).forEach(k => {
                        const cleanKey = k.trim().replace(/\r?\n|\r/g, '');
                        cleaned[cleanKey] = obj[k];
                    });
                    return cleaned;
                };

                let rawPark = json['Table Parked'] || json['TableParked'] || json.table_parked || json.parkData || json.parked || [];
                let rawPost = json['Table Posted'] || json['TablePosted'] || json.table_posted || json.postData || json.posted || [];
                let rawDetail = json['Table Detail Entry'] || json['TableDetailEntry'] || json.detail_entry || json.detailData || json.details || [];

                rawPark = Array.isArray(rawPark) ? rawPark.map(cleanObj) : [];
                rawPost = Array.isArray(rawPost) ? rawPost.map(cleanObj) : [];
                rawDetail = Array.isArray(rawDetail) ? rawDetail.map(cleanObj) : [];

                const parseNum = (val) => {
                    if (val === undefined || val === null || val === '') return 0;
                    if (typeof val === 'number') return val;
                    const cleaned = String(val).replace(/,/g, '.').replace(/[^0-9.]/g, '');
                    return parseFloat(cleaned) || 0;
                };

                // Group table_parked by PIC
                const picMap = {};
                rawPark.forEach((item, idx) => {
                    const name = item.pic_parked || item.name || item.PIC_Parked || `Staff ${idx+1}`;
                    if (!picMap[name]) {
                        picMap[name] = {
                            id: `PARK-0${Object.keys(picMap).length + 1}`,
                            name,
                            date: '2026-10-16',
                            parkedDocs: 0,
                            totalMin: 0,
                            totalSlaDays: 0,
                            countEntries: 0
                        };
                    }
                    const docs = parseNum(item.count_of_document_number_parked || 1);
                    const avgMin = parseNum(item.minutes_for_parked_per_invoice || 0);
                    
                    picMap[name].parkedDocs += docs;
                    picMap[name].totalMin += (avgMin * docs);
                    picMap[name].countEntries += 1;
                });

                // Convert grouped PIC to array
                let parsedPark = Object.values(picMap).map(p => {
                    const avgMinutes = p.parkedDocs > 0 ? (p.totalMin / p.parkedDocs).toFixed(1) : 0;
                    const slaDaysAvg = (avgMinutes / (8 * 60)).toFixed(1); // approximate 8 hours working day
                    return {
                        id: p.id,
                        name: p.name,
                        date: p.date,
                        parkedDocs: p.parkedDocs,
                        avgMinutes: parseFloat(avgMinutes),
                        slaDaysAvg: Math.max(parseFloat(slaDaysAvg), 0.5),
                        complianceRate: '95.0%',
                        vendors: []
                    };
                });

                // Extract vendors from detail_entry
                const vendorList = rawDetail.map(d => ({
                    name: d.vendor_name || 'Vendor SAP',
                    docCount: 1,
                    avgMin: parseNum(d.sla_pic_parked) * 15,
                    slaDays: parseNum(d.sla_pic_parked),
                    isOverSla: parseNum(d.sla_pic_parked) > 1.0
                }));

                if (parsedPark.length === 0) parsedPark = initialParkData;
                else {
                    parsedPark.forEach(p => {
                        p.vendors = vendorList.slice(0, 5); // assign top vendors
                    });
                }

                // Parse posted data
                let parsedPost = rawPost.map((item, idx) => ({
                    id: `POST-0${idx+1}`,
                    name: item.pic_post || item.name || `Supervisor ${idx+1}`,
                    date: '2026-10-16',
                    postedDocs: parseNum(item.count_of_document_number_posted || 45),
                    avgMinutes: parseNum(item.minutes_for_posted_per_invoice || 22.4),
                    slaDaysAvg: parseNum(item.sla_full_process || 2.1),
                    complianceRate: '92.0%',
                    vendors: vendorList.slice(0, 4)
                }));

                if (parsedPost.length === 0) parsedPost = initialPostData;

                return { parkData: parsedPark, postData: parsedPost };
            };

            // Fetch and load ap_metrics.json
            useEffect(() => {
                fetch('ap_metrics.json')
                    .then(res => {
                        if (res.ok) return res.json();
                        return fetch('/data/ap_metrics.json');
                    })
                    .then(res => {
                        if (res && res.ok) return res.json();
                        throw new Error('Loading via direct fetch');
                    })
                    .then(json => {
                        const normalized = normalizePowerAutomateData(json);
                        if (normalized.parkData) setParkData(normalized.parkData);
                        if (normalized.postData) setPostData(normalized.postData);
                        if (json.updated_at) {
                            const dateObj = new Date(json.updated_at);
                            setLastUpdated(dateObj.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) + ' WIB');
                        }
                    })
                    .catch(err => {
                        console.log('Menggunakan data contoh/fallback standar:', err.message);
                    });
            }, []);

            const parkStaffList = useMemo(() => {
                const unique = {};
                parkData.forEach(d => {
                    if (!unique[d.id]) unique[d.id] = { id: d.id, name: d.name };
                });
                return Object.values(unique);
            }, [parkData]);

            const postSpvList = useMemo(() => {
                const unique = {};
                postData.forEach(d => {
                    if (!unique[d.id]) unique[d.id] = { id: d.id, name: d.name };
                });
                return Object.values(unique);
            }, [postData]);

            const filteredParkData = useMemo(() => {
                let list = parkData;
                if (selectedParkPic !== 'ALL') {
                    list = list.filter(p => p.id === selectedParkPic || p.name === selectedParkPic);
                }
                return list;
            }, [selectedParkPic, parkData]);

            const filteredPostData = useMemo(() => {
                let list = postData;
                if (selectedPostSpv !== 'ALL') {
                    list = list.filter(p => p.id === selectedPostSpv || p.name === selectedPostSpv);
                }
                return list;
            }, [selectedPostSpv, postData]);

            const parkVendorList = useMemo(() => {
                const map = {};
                filteredParkData.forEach(pic => {
                    if (pic.vendors) {
                        pic.vendors.forEach(v => {
                            if (!map[v.name]) {
                                map[v.name] = { name: v.name, docCount: 0, totalMin: 0, totalSlaDays: 0, isOverSla: false };
                            }
                            map[v.name].docCount += v.docCount;
                            map[v.name].totalMin += (v.avgMin * v.docCount);
                            map[v.name].totalSlaDays += (v.slaDays * v.docCount);
                        });
                    }
                });
                return Object.values(map).map(v => {
                    const avgMin = (v.totalMin / (v.docCount || 1)).toFixed(1);
                    const avgSlaDays = (v.totalSlaDays / (v.docCount || 1)).toFixed(1);
                    return {
                        ...v,
                        avgMin,
                        avgSlaDays,
                        isOverSla: parseFloat(avgSlaDays) > 1.0
                    };
                });
            }, [filteredParkData]);

            const postVendorList = useMemo(() => {
                const map = {};
                filteredPostData.forEach(spv => {
                    if (spv.vendors) {
                        spv.vendors.forEach(v => {
                            if (!map[v.name]) {
                                map[v.name] = { name: v.name, docCount: 0, totalMin: 0, totalSlaDays: 0, isOverSla: false };
                            }
                            map[v.name].docCount += v.docCount;
                            map[v.name].totalMin += (v.avgMin * v.docCount);
                            map[v.name].totalSlaDays += (v.slaDays * v.docCount);
                        });
                    }
                });
                return Object.values(map).map(v => {
                    const avgMin = (v.totalMin / (v.docCount || 1)).toFixed(1);
                    const avgSlaDays = (v.totalSlaDays / (v.docCount || 1)).toFixed(1);
                    return {
                        ...v,
                        avgMin,
                        avgSlaDays,
                        isOverSla: parseFloat(avgSlaDays) > 3.0
                    };
                });
            }, [filteredPostData]);

            return (
                <div className="min-h-screen bg-[#0b1210] text-slate-100 flex flex-col font-sans">
                    <header className="border-b border-sunpride-border bg-[#111c19]/90 backdrop-blur sticky top-0 z-50 px-4 sm:px-6 lg:px-8 py-3">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="bg-gradient-to-tr from-amber-400 to-emerald-500 p-2.5 rounded-xl text-slate-950 font-black shadow-lg shadow-amber-500/20">
                                    <ZapIcon size={22} className="fill-slate-950" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-base sm:text-lg leading-tight text-amber-400 flex items-center gap-2">
                                        SUNPRIDE <span className="text-white font-normal">| SAP AP PIC Performance & SLA Analytics</span>
                                    </h1>
                                    <p className="text-xs text-emerald-400/80">Monitoring Performance Staff (Parked) & SPV (Posted) • Connected to ap_metrics.json</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-3">
                                <div className="flex items-center space-x-2 text-xs bg-[#182420] px-3 py-1.5 rounded-lg border border-sunpride-border text-slate-300">
                                    <RefreshCwIcon size={14} className="text-amber-400 animate-spin-slow" />
                                    <span>Last Sync JSON: <strong className="text-amber-400 font-semibold">{lastUpdated}</strong></span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
                        {/* SECTION 1: PARKED STAFF */}
                        <section className="bg-[#141f1c] border border-amber-500/40 rounded-2xl p-6 shadow-xl relative overflow-hidden space-y-6">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-bl-full pointer-events-none"></div>

                            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-sunpride-border">
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <span className="px-2.5 py-1 bg-amber-500 text-slate-950 rounded-lg text-xs font-bold uppercase tracking-wider">
                                            1. Performance Staff (Parked)
                                        </span>
                                        <span className="text-xs text-slate-300 font-medium">Target SLA: <strong className="text-amber-400">1 Hari</strong></span>
                                    </div>
                                    <h2 className="text-lg font-bold text-amber-300 mt-1">Kinerja Parked per Invoice, Vendor Impact & Analisis Tren</h2>
                                </div>

                                <div className="flex flex-wrap items-center gap-3">
                                    <div className="flex items-center space-x-2 bg-[#0b1210] p-1.5 px-3 rounded-xl border border-amber-500/30">
                                        <FilterIcon size={14} className="text-amber-400 shrink-0" />
                                        <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">PIC Staff:</span>
                                        <select 
                                            value={selectedParkPic} 
                                            onChange={(e) => setSelectedParkPic(e.target.value)}
                                            className="bg-[#141f1c] border border-amber-500/30 text-xs font-semibold text-amber-300 rounded-lg px-2 py-1 focus:outline-none focus:border-amber-400 min-w-[150px]"
                                        >
                                            <option value="ALL">Semua Staff Park</option>
                                            {parkStaffList.map(staff => (
                                                <option key={staff.id} value={staff.id}>{staff.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                            </div>
